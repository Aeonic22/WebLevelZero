<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">Web Projects</a>
        </div>
    </nav>

    <main class="container page-main">
        <div class="row">
            <div class="col-md-8 mx-auto page-content page-content--scroll">
                <div class="page-header">
                    <a href="../../index.html" class="back-link">← Back to Home</a>
                    <h1>Todo App</h1>
                </div>

                <div class="card scroll-card">
                    <div class="card-body">
                        <div class="scroll-card__toolbar">
                            <div class="input-group">
                                <input type="text" id="todoInput" class="form-control" placeholder="Add a new task...">
                                <button class="btn btn-primary" onclick="addTodo()">Add</button>
                            </div>
                        </div>

                        <div class="scroll-card__body">
                            <ul id="todoList" class="list-group">
                            </ul>
                        </div>

                        <div class="scroll-card__footer">
                            <button class="btn btn-danger" onclick="clearCompleted()">Clear Completed</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/todo.js"></script>
</body>
</html>
