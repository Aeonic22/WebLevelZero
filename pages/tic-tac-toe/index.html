<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="stylesheet" href="../../assets/js/tic-tac-toe.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">Web Projects</a>
        </div>
    </nav>

    <main class="container page-main">
        <div class="row">
            <div class="col-md-6 mx-auto page-content">
                <div class="page-header">
                    <a href="../../index.html" class="back-link">← Back to Home</a>
                    <h1>Tic Tac Toe</h1>
                </div>

                <div class="card">
                    <div class="card-body text-center">
                        <p id="status" class="lead">Game Status</p>
                        <div id="board" class="tic-tac-toe-board">
                            <button class="cell" data-index="0"></button>
                            <button class="cell" data-index="1"></button>
                            <button class="cell" data-index="2"></button>
                            <button class="cell" data-index="3"></button>
                            <button class="cell" data-index="4"></button>
                            <button class="cell" data-index="5"></button>
                            <button class="cell" data-index="6"></button>
                            <button class="cell" data-index="7"></button>
                            <button class="cell" data-index="8"></button>
                        </div>
                        <button class="btn btn-primary mt-3" onclick="resetGame()">New Game</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/tic-tac-toe.js"></script>
</body>
</html>
