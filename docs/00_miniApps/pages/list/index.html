<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/WebLevelZero/assets/style-CPBEyZVo.css">
</head>
<body class="has-page-header">
    <header class="page-header">
        <div class="container">
            <div class="page-header__inner">
                <a href="../../index.html" class="back-link">← Back to Home</a>
                <h1>Dynamic List</h1>
            </div>
        </div>
    </header>

    <main class="container page-main">
        <div class="row">
            <div class="col-md-8 mx-auto page-content page-content--scroll">

                <div class="card scroll-card">
                    <div class="card-body">
                        <div class="scroll-card__toolbar">
                            <div class="input-group">
                                <input type="text" id="itemInput" class="form-control" placeholder="Add item...">
                                <button class="btn btn-primary" onclick="addItem()">Add</button>
                            </div>
                        </div>

                        <div class="scroll-card__body">
                            <div id="listContainer">
                                <p class="text-muted">No items yet. Add one to get started!</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/list.js"></script>
</body>
</html>
