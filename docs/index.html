<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>WebLevelZero</title>
    <link rel="manifest" href="/WebLevelZero/manifest.json" />
  </head>
  <body>
    <main>
      <h1>WebLevelZero</h1>

      <nav aria-label="Project links">
        <p id="buildId">Build: 4</p>
        <ul>
          <li><a href="/WebLevelZero/">Home</a></li>
          <li><a href="/WebLevelZero/00_miniApps/">Mini Apps Hub</a></li>
          <li><a href="/WebLevelZero/00_miniApps/pages/hello-world/">Hello World</a></li>
          <li><a href="/WebLevelZero/00_miniApps/pages/list/">List</a></li>
          <li><a href="/WebLevelZero/00_miniApps/pages/todo/">Todo</a></li>
          <li><a href="/WebLevelZero/00_miniApps/pages/tic-tac-toe/">Tic Tac Toe</a></li>
          <li><a href="/WebLevelZero/01_cssPlayground/">CSS Playground</a></li>
          <li><a href="/WebLevelZero/02_neda_v01/">Neda</a></li>
        </ul>
      </nav>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/WebLevelZero/sw.js');
        });

        // Reload once when a new service worker takes control, so an
        // update applies immediately instead of waiting for a manual refresh.
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
