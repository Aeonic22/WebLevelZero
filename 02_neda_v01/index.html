<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neda</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>Neda</h1>
        <div class="header-actions">
          <button id="filterToggle" class="icon-btn" type="button" title="Show/hide completed items" aria-pressed="false">&#10003;</button>
          <button id="settingsToggle" class="secondary" type="button">Settings</button>
        </div>
      </header>

      <section id="settingsPanel" class="card hidden">
        <label for="nameInput">Your name</label>
        <div class="settings-row">
          <input id="nameInput" type="text" maxlength="40" placeholder="Enter your name" />
          <button id="saveName" type="button">Save</button>
        </div>

        <div class="device-row">
          <label for="deviceIdDisplay">Device ID</label>
          <div class="settings-row device-box">
            <input id="deviceIdDisplay" type="text" readonly value="" aria-label="Device ID" />
            <button id="deviceIdBtn" type="button" class="secondary">Copy</button>
          </div>
        </div>
      </section>

      <section class="card controls">
        <div class="todo-compose">
          <input id="todoInput" type="text" maxlength="140" placeholder="Trebam... (type a todo item)" autocomplete="off" />
          <ul id="todoSuggestions" class="suggestions-list hidden"></ul>
        </div>
        <div class="button-row">
          <button id="helloBtn" class="primary" type="button">Hello</button>
          <button id="trebamBtn" class="primary" type="button">Trebam</button>
          <button id="eraseBtn" class="danger" type="button">Erase</button>
        </div>
      </section>

      <section class="card">
        <h2>Recent messages</h2>
        <ul id="messagesList" class="messages-list"></ul>
      </section>

      <p id="statusMessage" class="status-message" aria-live="polite"></p>
    </main>

    <script type="module" src="./js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/WebLevelZero/sw.js');
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
